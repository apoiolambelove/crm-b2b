<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resetar Senha · LambeLove</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * { box-sizing: border-box; }

    html, body { width: 100%; overflow-x: hidden; }

    .login-shell {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 30px;
      background: var(--bg-default);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .reset-card h2 {
      font-size: 22px;
      margin: 0 0 8px 0;
      color: var(--ink-hard);
    }

    .reset-card p.lead {
      color: var(--ink-soft);
      font-size: 14px;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }

    .reset-card .form-control {
      width: 100%;
      font-size: 16px;
      margin-bottom: 16px;
    }

    .reset-card #btnResetar {
      width: 100%;
      min-height: 44px;
    }

    .success-message {
      display: none;
      background: #f0fdf4;
      border: 1px solid #dcfce7;
      color: #166534;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .voltar-link {
      display: inline-block;
      margin-top: 18px;
      font-size: 13px;
      color: var(--ink-soft);
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .login-shell { padding: 12px; }
      .reset-card { padding: 28px 18px; }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="reset-card">
      <h2><i class="fa-solid fa-key"></i> Resetar Senha</h2>
      <p class="lead">Área exclusiva do administrador. Informe o usuário da vendedora e defina a nova senha temporária dela.</p>

      <div class="login-error" id="resetError" style="display:none;"></div>
      <div class="success-message" id="resetSuccess"></div>

      <form id="formReset">
        <label class="form-label">Usuário da vendedora</label>
        <input type="text" class="form-control" id="nomeUsuarioAlvo" placeholder="ex: Alessandra" required>

        <label class="form-label">Nova senha temporária</label>
        <input type="text" class="form-control" id="novaSenhaAlvo" placeholder="mínimo 6 caracteres" required>

        <button type="submit" class="btn-brand" id="btnResetar">
          <i class="fa-solid fa-key"></i> Resetar Senha
        </button>
      </form>

      <a href="/dashboard.html" class="voltar-link"><i class="fa-solid fa-arrow-left"></i> Voltar ao painel</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    // Só admin pode acessar esta página
    const usuario = getUsuario();
    if (!getToken() || !usuario) {
      window.location.href = '/index.html';
    } else if (usuario.perfil !== 'ADMIN') {
      window.location.href = '/dashboard.html';
    }

    document.getElementById('formReset').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroBox = document.getElementById('resetError');
      const sucessoBox = document.getElementById('resetSuccess');
      erroBox.style.display = 'none';
      sucessoBox.style.display = 'none';

      const btn = document.getElementById('btnResetar');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resetando...';

      try {
        const data = await api('admin-reset-senha', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${getToken()}` },
          body: {
            nome_usuario: document.getElementById('nomeUsuarioAlvo').value.trim(),
            nova_senha: document.getElementById('novaSenhaAlvo').value,
          },
        });

        sucessoBox.textContent = data.mensagem || 'Senha redefinida com sucesso.';
        sucessoBox.style.display = 'block';
        document.getElementById('formReset').reset();
      } catch (err) {
        erroBox.textContent = err.message || 'Erro ao resetar a senha.';
        erroBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-key"></i> Resetar Senha';
      }
    });
  </script>
</body>
</html>
