<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alterar Senha · LambeLove</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    .login-shell {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .change-password-card {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 30px;
      background: var(--bg-default);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .change-password-card .form-control {
      width: 100%;
      font-size: 16px; /* evita zoom automático no iOS ao focar o campo */
    }
    
    .change-password-card h2 {
      font-size: 24px;
      margin: 0 0 8px 0;
      color: var(--ink-hard);
    }
    
    .change-password-card p.lead {
      color: var(--ink-soft);
      font-size: 14px;
      margin: 0 0 28px 0;
      line-height: 1.5;
    }
    
    .password-strength {
      margin-top: 8px;
      font-size: 12px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    
    .strength-bar {
      height: 4px;
      flex: 1;
      background: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
    }
    
    .strength-fill {
      height: 100%;
      width: 0%;
      background: #ef4444;
      transition: width 0.3s ease;
    }
    
    .strength-text {
      min-width: 50px;
      text-align: right;
    }
    
    .strength-fill.weak { background: #ef4444; width: 25%; }
    .strength-fill.medium { background: #f59e0b; width: 50%; }
    .strength-fill.good { background: #10b981; width: 75%; }
    .strength-fill.strong { background: #059669; width: 100%; }
    
    .password-input-group {
      position: relative;
      margin-bottom: 16px;
    }
    
    .toggle-password {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--ink-soft);
      background: none;
      border: none;
      padding: 10px;
      font-size: 16px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .toggle-password:hover {
      color: var(--ink-hard);
    }
    
    .form-control.has-password-toggle {
      padding-right: 40px;
    }
    
    .info-box {
      background: #f0f9ff;
      border-left: 4px solid #0284c7;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 13px;
      color: #0c4a6e;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    
    .success-message {
      display: none;
      background: #f0fdf4;
      border: 1px solid #dcfce7;
      color: #166534;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .success-message i {
      margin-right: 8px;
      color: #16a34a;
    }
    
    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .button-group .btn-brand,
    .button-group .btn-secondary {
      flex: 1 1 140px;
      min-height: 44px;
    }
    
    .button-group .btn-secondary {
      background: var(--bg-soft);
      color: var(--ink-hard);
      border: 1px solid var(--border-color);
    }
    
    .button-group .btn-secondary:hover {
      background: #f3f4f6;
    }

    /* Telas pequenas (celular) */
    @media (max-width: 480px) {
      .login-shell {
        padding: 12px;
      }

      .change-password-card {
        padding: 28px 18px;
        border-radius: 10px;
      }

      .change-password-card h2 {
        font-size: 20px;
      }

      .change-password-card p.lead {
        font-size: 13px;
      }

      .info-box {
        font-size: 12.5px;
        padding: 10px 12px;
      }

      .button-group {
        flex-direction: column;
      }

      .button-group .btn-brand,
      .button-group .btn-secondary {
        flex: 1 1 auto;
        width: 100%;
      }

      .strength-text {
        min-width: 44px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="change-password-card">
      <h2><i class="fa-solid fa-lock"></i> Alterar Senha</h2>
      <p class="lead">Esta é sua primeira vez acessando o sistema. Escolha uma nova senha para sua conta.</p>

      <div class="info-box">
        <i class="fa-solid fa-info-circle"></i>
        A sua senha original é temporária. Por questões de segurança, você precisa criar uma senha pessoal agora.
      </div>

      <div class="login-error" id="changeError" style="display: none;"></div>
      <div class="success-message" id="successMessage">
        <i class="fa-solid fa-check-circle"></i> Senha alterada com sucesso! Redirecionando...
      </div>

      <form id="formChangePassword" style="display: none;">
        <!-- Senha Atual (Temporária) -->
        <label class="form-label">Senha Atual (Temporária)</label>
        <div class="password-input-group">
          <input 
            type="password" 
            class="form-control has-password-toggle" 
            id="senhaAtual" 
            placeholder="Digite a senha que recebeu"
            autocomplete="current-password"
            required>
          <button type="button" class="toggle-password" onclick="togglePasswordField('senhaAtual')">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>

        <!-- Nova Senha -->
        <label class="form-label">Nova Senha</label>
        <div class="password-input-group">
          <input 
            type="password" 
            class="form-control has-password-toggle" 
            id="senhaNova" 
            placeholder="Crie uma nova senha"
            autocomplete="new-password"
            required>
          <button type="button" class="toggle-password" onclick="togglePasswordField('senhaNova')">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <div class="password-strength" id="strengthIndicator">
          <div class="strength-bar">
            <div class="strength-fill"></div>
          </div>
          <span class="strength-text" id="strengthText">Fraca</span>
        </div>

        <!-- Confirmar Nova Senha -->
        <label class="form-label">Confirmar Nova Senha</label>
        <div class="password-input-group">
          <input 
            type="password" 
            class="form-control has-password-toggle" 
            id="confirmarSenha" 
            placeholder="Repita a nova senha"
            autocomplete="new-password"
            required>
          <button type="button" class="toggle-password" onclick="togglePasswordField('confirmarSenha')">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>

        <div class="button-group" style="margin-top: 28px;">
          <button type="submit" class="btn-brand" id="btnAlterar">
            <i class="fa-solid fa-key"></i> Alterar Senha
          </button>
          <button type="button" class="btn-secondary" id="btnSair" onclick="fazerLogout()">
            <i class="fa-solid fa-sign-out-alt"></i> Sair
          </button>
        </div>
      </form>

      <div id="loadingMessage" style="text-align: center; padding: 20px;">
        <i class="fa-solid fa-spinner fa-spin"></i> Carregando...
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    // Função para alternar visibilidade de senha
    function togglePasswordField(fieldId) {
      const input = document.getElementById(fieldId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    // Avalia força da senha
    function evaluateSenhaStrength(senha) {
      let strength = 0;
      
      if (senha.length >= 6) strength += 1;
      if (senha.length >= 10) strength += 1;
      if (/[a-z]/.test(senha)) strength += 1;
      if (/[A-Z]/.test(senha)) strength += 1;
      if (/[0-9]/.test(senha)) strength += 1;
      if (/[^a-zA-Z0-9]/.test(senha)) strength += 1;
      
      return strength;
    }

    function updateStrengthIndicator() {
      const senha = document.getElementById('senhaNova').value;
      const strength = evaluateSenhaStrength(senha);
      const fill = document.querySelector('.strength-fill');
      const text = document.getElementById('strengthText');
      
      let className = '';
      let label = '';
      
      if (strength <= 1) {
        className = 'weak';
        label = 'Fraca';
      } else if (strength <= 2) {
        className = 'medium';
        label = 'Média';
      } else if (strength <= 4) {
        className = 'good';
        label = 'Boa';
      } else {
        className = 'strong';
        label = 'Forte';
      }
      
      fill.className = 'strength-fill ' + className;
      text.textContent = label;
    }

    // Carrega dados do usuário do localStorage
    function initForm() {
      const token = getToken();
      const usuario = getUsuario();

      if (!token || !usuario) {
        window.location.href = '/index.html';
        return;
      }

      // Se já alterou a senha, vai pro dashboard
      if (usuario.primeira_vez_login === false) {
        window.location.href = '/dashboard.html';
        return;
      }

      document.getElementById('loadingMessage').style.display = 'none';
      document.getElementById('formChangePassword').style.display = 'block';
      
      // Saudação personalizada
      document.querySelector('.change-password-card p.lead').textContent = 
        `Olá ${usuario.nome_completo}! Esta é sua primeira vez acessando o sistema. Escolha uma nova senha para sua conta.`;
    }

    // Fazer logout
    function fazerLogout() {
      if (confirm('Tem certeza que deseja sair sem alterar a senha?')) {
        localStorage.removeItem('crm_token');
        localStorage.removeItem('crm_usuario');
        window.location.href = '/index.html';
      }
    }

    // Submit do formulário
    document.getElementById('formChangePassword').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const senhaAtual = document.getElementById('senhaAtual').value;
      const senhaNova = document.getElementById('senhaNova').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;
      const erroBox = document.getElementById('changeError');
      const successBox = document.getElementById('successMessage');
      const btn = document.getElementById('btnAlterar');

      // Validações
      if (senhaNova.length < 6) {
        erroBox.textContent = 'A nova senha deve ter pelo menos 6 caracteres.';
        erroBox.style.display = 'block';
        return;
      }

      if (senhaNova !== confirmarSenha) {
        erroBox.textContent = 'As senhas não conferem.';
        erroBox.style.display = 'block';
        return;
      }

      if (senhaAtual === senhaNova) {
        erroBox.textContent = 'A nova senha não pode ser igual à senha atual.';
        erroBox.style.display = 'block';
        return;
      }

      erroBox.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Alterando...';

      try {
        const data = await api('change-password', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${getToken()}`
          },
          body: {
            senha_antiga: senhaAtual,
            senha_nova: senhaNova,
            confirmar_senha: confirmarSenha,
          },
        });

        // Atualiza localStorage com os novos dados
        const usuarioAtualizado = data.usuario;
        usuarioAtualizado.primeira_vez_login = false;
        localStorage.setItem('crm_usuario', JSON.stringify(usuarioAtualizado));

        // Mostra mensagem de sucesso
        document.getElementById('formChangePassword').style.display = 'none';
        successBox.style.display = 'block';

        // Redireciona após 2 segundos
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 2000);

      } catch (err) {
        erroBox.textContent = err.message || 'Erro ao alterar a senha.';
        erroBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-key"></i> Alterar Senha';
      }
    });

    // Event listener para força de senha
    document.getElementById('senhaNova').addEventListener('input', updateStrengthIndicator);

    // Inicializa
    initForm();
  </script>
</body>
</html>
